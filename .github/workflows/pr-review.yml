name: LLM PR Review

on:
  pull_request:
    types: [opened, synchronize]

# 同一 PR 多次 push 时，cancel 掉旧的 review run，避免重复烧审核模型 token + 评论刷屏
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review PR
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_wait_seconds: 10
          timeout_minutes: 10
          command: bash .github/scripts/review.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_PROVIDER: ${{ vars.PR_REVIEW_PROVIDER }}
          REVIEW_API_KEY: ${{ secrets.REVIEW_API_KEY }}
          REVIEW_API_URL: ${{ vars.PR_REVIEW_API_URL }}
          REVIEW_MODEL: ${{ vars.PR_REVIEW_MODEL }}
          REVIEW_MAX_TOKENS: ${{ vars.PR_REVIEW_MAX_TOKENS || '131072' }}
          REVIEW_CONNECT_TIMEOUT: ${{ vars.PR_REVIEW_CONNECT_TIMEOUT || '15' }}
          REVIEW_MAX_TIME: ${{ vars.PR_REVIEW_MAX_TIME || '180' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
