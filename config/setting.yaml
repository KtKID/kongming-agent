config_schema_version: v0.5  # 配置结构版本；当前版本为 v0.5。

# kongming-agent 统一配置
#
# 单一配置文件，覆盖所有模块的全部可配置项。
# 切换远端模型：在 .env 中设置 KONGMING_MODEL_BASE_URL 和 KONGMING_MODEL_API_KEY。

model:
  # provider: 可选。openai_compatible / anthropic / 省略（推荐省略，让 URL 决定）。
  #
  # ⚡ 4 级智能路由（effective_provider，v0.2 起）：
  #   按以下优先级判定真实 provider，省去用户手动同步 yaml 与 .env 的麻烦：
  #
  #   1. URL path 强信号（最高优先级，覆盖 declare）：
  #        - host = api.anthropic.com → anthropic
  #        - 路径含独立 "anthropic" 段 → anthropic（升级，第三方兼容端点）
  #        - 路径末尾段是 v\d+（v1/v2/...）→ openai_compatible（降级）
  #   2. Host 路由表（见 provider_routing 字段）
  #   3. 用户 declare（本字段，可选）
  #   4. 默认 openai_compatible
  #
  #   实例：
  #     base_url=http://127.0.0.1:1234/v1                 → openai_compatible（path v1）
  #     base_url=https://open.bigmodel.cn/api/paas/v4     → openai_compatible（path v4）
  #     base_url=https://api.openai.com/v1                → openai_compatible（path v1）
  #     base_url=https://api.anthropic.com                → anthropic（host 命中）
  #     base_url=https://api.minimaxi.com/anthropic       → anthropic（path 含 anthropic）
  #     base_url=https://api.minimaxi.com/v1              → openai_compatible（path v1）
  #
  # base_url 写法约定（按选定协议）：
  #   openai_compatible：**带版本段**（如 /v1, /v4）。代码拼 /chat/completions。
  #   anthropic：       **不带版本段**。代码拼 /v1/messages。
  #     ⚠ 若 anthropic 端点误写 /anthropic/v1，会拼成 /anthropic/v1/v1/messages 而 404。
  #
  # 通常省略 provider 字段即可。仅当未知厂商 + URL 无强信号 + host 不在 provider_routing 时（罕见 corner case），才需显式 declare。
  provider:
  name: gemma-4-e4b-it
  base_url: http://127.0.0.1:1234/v1
  # 本地模型留空；远端模型在 .env 中填写 KONGMING_MODEL_API_KEY。
  api_key: ""
  # 单次请求超时秒数。
  timeout: 60
  # 单次响应最大 token 数。
  max_tokens: 4096
  # 采样温度，范围 [0, 2]。0 最确定，2 最随机。
  temperature: 0.7

  # Host → provider 路由表（按协议分组）。effective_provider 4 级判定的第 2 级，
  # 用于 path 启发式无强信号但 host 已知的场景（如裸 host ``https://api.openai.com``）。
  #
  # 内置常见 host 默认（无需在此重写）；仅在新增自定义 host 时写 provider_routing。
  #
  # 用户在此**新增 host 时与默认表合并**（不替换；list extend + 去重）。例如：
  # provider_routing:
  #   openai_compatible:
  #     - api.my-new-llm.example.com   # 自定义 OpenAI 兼容厂商
  #   anthropic:
  #     - my-anthropic-proxy.internal  # 自定义 Anthropic 兼容代理
  #
  # 注意：path 启发式（path 含 "anthropic" 段 / 末尾 vN）**优先于**本表。同 host
  # 双协议（如 MiniMax 同时有 /v1 OpenAI 和 /anthropic Anthropic 端点）由 path 区分。
  provider_routing:
    openai_compatible:
    - api.openai.com
    - open.bigmodel.cn
    - api.deepseek.com
    - api.moonshot.cn
    - api.minimaxi.com
    - localhost
    - 127.0.0.1
    anthropic:
    - api.anthropic.com

  # 推理深度控制。可选值：low | medium | high | （注释掉表示不发此参数，使用模型默认）。
  # 仅在 reasoning_profiles 中声明了对应模型时生效；不声明 profile 则此字段被忽略。
  reasoning_effort: high

  # 模型 reasoning 能力声明。key 为模型名或前缀，用于将 reasoning_effort 映射到
  # 各厂商 payload 格式。不配置此节时，reasoning_effort 静默不生效。
  #
  # 每条 profile 字段说明：
  #   match:   exact（完全匹配模型名）或 prefix（模型名以 key 开头即命中）
  #   adapter: 命中后使用的翻译策略，支持三种：
  #     none                         — 明确不发送 reasoning 参数（如本地 gemma）
  #     glm_thinking_budget          — 智谱 GLM 深度思考系列
  #                                    payload 注入：{"thinking": {"type": "enabled", "budget_tokens": N}}
  #                                    budget_tokens = 模型允许用于内部推理的最大 token 数
  #                                    GLM 官方推荐范围：1024–32768，超出上限按上限处理
  #     anthropic_compatible_reasoning — Anthropic 兼容层（如 MiniMax）
  #                                    payload 注入：{"reasoning_effort": "low"|"medium"|"high"}
  #   effort_map:        glm_thinking_budget 必填；low/medium/high 各档对应的 budget_tokens 值
  #                      参考值：low=1024（快速）  medium=8192（均衡）  high=32768（深度）
  #   supported_efforts: anthropic_compatible_reasoning 必填；列出该模型支持的档位
  #
  reasoning_profiles:
    glm-5:                            # 匹配 glm-5.1 / glm-5-plus 等
      match: prefix
      adapter: glm_thinking_budget
      effort_map:
        low: 1024
        medium: 8192
        high: 32768
    glm-z:                            # 匹配 glm-z1 / glm-z1-flash 等
      match: prefix
      adapter: glm_thinking_budget
      effort_map:
        low: 1024
        medium: 8192
        high: 32768
    glm-zero:                         # 匹配 glm-zero-preview 等
      match: prefix
      adapter: glm_thinking_budget
      effort_map:
        low: 1024
        medium: 8192
        high: 32768
    gemma-4-e4b-it:                   # 本地模型明确禁用 reasoning 参数
      match: exact
      adapter: none
    MiniMax-M3:                       # MiniMax Anthropic 兼容端点
      match: prefix
      adapter: anthropic_compatible_reasoning
      supported_efforts: [low, medium, high]

runner:
  max_turns: 90

session:
  # memory | sqlite | file
  backend: file
  # .kongming/* 运行数据路径统一派生到 kongming_home（默认 ~/.kongming）。
  store_path: .kongming/sessions.db
  file_store_path: .kongming/sessions

trace:
  # .kongming/* 运行数据路径统一派生到 kongming_home。
  output_path: .kongming/trace.jsonl
  auto_flush: true
  # 是否 dump 每次 LLM 交互到 .kongming/debug/raw-llm-*.json（含完整 request+response）
  # 调试用，默认 false；开启后每次对话都会落盘，磁盘会增长
  # 临时启用不改本文件：`KONGMING_TRACE_RAW_LLM=1 uv run python -m cli.main`
  raw_llm: false

logging:
  level: INFO

host:
  kind: cli

approval:
  # interactive | auto_allow | auto_deny
  mode: interactive

scheduler:
  enabled: true
  # 留空时使用 <kongming_home>/cron；显式 .kongming/* 会继续派生到 kongming_home。
  home:
  interval: 1.0
  max_inflight: 8
  max_task_age_seconds:
  default_timezone: Asia/Shanghai
  default_delivery_channel: web
  # v0.5.1: 任务级 task.policy.max_turns=None 时的兜底；司天扫描类重型任务建议 ≥60。
  default_max_turns: 90
  approval:
    mode: trust
    allow_write_file_create_in_cwd: true
tool:
  shell:
    enabled: true
    timeout_seconds: 30.0
    max_stream_bytes: 8000
    terminate_grace_seconds: 2.0
  file:
    enabled: true
    read_max_bytes: 65536

mcp:
  enabled: true
  servers:
  - server_id: minimax
    command: uvx
    args:
    - minimax-coding-plan-mcp
    - "-y"
    env:
      MINIMAX_API_HOST: https://api.minimax.io
    secret_env_keys:
    - MINIMAX_API_KEY
    initialize_timeout_ms: 30000
    call_timeout_ms: 60000

web_search:
  enabled: true
  provider_name: minimax_web_search
  search_tool_name: mcp__minimax__web_search
  search_tool_names:
  - mcp__minimax__web_search
  - web_search
  max_results: 5

compactor:
  # 默认关闭：现有压缩仅做消息数 FIFO，和 LLM summarize 式压缩差距大。
  # 正式 LLM summarize 压缩待后续独立 task compactor-v2-llm-summarize 实施，
  # 届时再把默认值切到 true。当前可手动设 true 体验 FIFO 语义。
  enabled: false
  # 送给 LLM 之前历史消息数超过此阈值才触发压缩；不改 session 本身。
  max_messages: 50
  # 压缩时保留最近 N 条原样不动。
  keep_recent: 20
  # 压缩时是否保留首条 system 指令（通常都是）。
  keep_system: true
  # 单条 tool 结果被压缩时保留的最大字符数，超出截断。
  tool_result_max_chars: 2000

retry:
  max_retries: 3
  retry_backoff: 1.0

cli:
  # 每轮响应后是否在终端打印模型思考内容（reasoning_content）。
  # 仅当模型实际返回了 reasoning_content 时才输出，否则静默。
  # 也可临时用 --show-reasoning flag 覆盖，不改此文件。
  show_reasoning: true

stream:
  # LLM 流式响应配置（v0.2 接入阶段，2026-04-25）。
  #
  # enabled=True 出厂即用打字机效果；可用 --no-stream flag 或
  # KONGMING_STREAM_ENABLED=0 临时关闭，不需要改本文件。
  enabled: true
  # 流式 read 超时（秒）。心跳期间不计入此超时；本地 endpoint 由 provider
  # 装配层根据 model.is_local 自动上调（见 OpenAIResponsesProvider）。
  read_timeout: 120.0
  # 流中出现 tool_call 后，runner 是否屏蔽继续到达的 content.delta。
  # 默认 True，避免 CLI 在 tool 调用前打印夹带的乱文本。
  suppress_content_after_tool_call: true
  # JsonlTraceSink 对 content.delta / reasoning.delta 的采样策略：
  #   none     不写（默认，防爆磁盘）
  #   periodic 按 periodic_batch_size 抽样
  #   full     全写（仅 debug）
  delta_sampling: none
  # delta_sampling=periodic 时的采样批大小，每 N 个 delta 取 1 个落盘。
  periodic_batch_size: 20

evolution:
  memory:
    # 是否启用 memory 模块（跨会话长期记忆）。False 时：不加载 memory 目录、
    # 不注册 memory tool、不 emit snapshot 事件。
    enabled: true
    # memory 根目录。.kongming/* 派生到 kongming_home；绝对路径直接使用。
    root_path: .kongming/memory
    # 是否将 memory snapshot 注入 system prompt。
    # False 时 memory tool 仍可用，但 prompt 不含 memory block。
    inject_prompt: true
    # 单个 memory 文件读取的最大字符数上限，防止异常巨大的文件吃掉 prompt 预算。
    read_max_chars: 65536
    # memory tool view 动作返回的最大字符数。
    view_max_chars: 3000
  learning:
    # ---------- 总开关 ----------
    # 是否启用自我进化。关闭后 EvolutionManager 所有 API 都是 no-op。
    enabled: true
    # 进化模式，当前仅支持 child_agent（派子 agent 复盘）。
    mode: child_agent
    # reviewer 是否在后台异步执行（不阻塞主对话）。
    background: true

    # ---------- reviewer 独立模型配置 ----------
    # 全部留空时继承主 agent 的 model / base_url / api_key / provider。
    # 跟 web.llm_presets 同模式：可以让 reviewer 用跟主模型完全不同的服务。
    # reviewer 模型名（如 claude-sonnet-4-20250514 / MiniMax-M3）。
    model_name:
    # reviewer 独立 API 地址（如 https://api.anthropic.com / https://api.minimaxi.com/anthropic）。
    base_url:
    # API key 从哪个环境变量读。值填环境变量名，不填 key 本身。
    api_key_env: EVOLUTION_REVIEWER_API_KEY
    # provider 类型：openai_compatible / anthropic。留空时按 URL 自动检测。
    provider:
    # reviewer 推理深度：high / medium / low。留空时继承主 agent。
    reasoning_effort:

    # ---------- 触发节律 ----------
    # 每 N 轮用户消息触发一次 reviewer。所有频道（claude/codex/native）共用。
    every_n_runs: 10
    # 累计不足 N 轮时不触发（冷启动保护，避免前几条消息就跑 reviewer）。
    min_user_turns: 5

    # ---------- reviewer 证据窗口 ----------
    # reviewer 看到的最近消息条数。越大 token 消耗越高，但上下文越完整。
    max_history_messages: 20

    # ---------- 养料提炼 ----------
    # 单次 review 最多提炼几条养料（nutrient）。
    max_nutrients: 5
    # 低于此置信度的养料直接丢弃，不进候选队列。
    nutrient_confidence_threshold: 0.75

    # ---------- 超时与生命周期 ----------
    # reviewer 单次执行超时（秒）。超时后如果 evolution_write 已调用则保留结果。
    review_timeout_seconds: 120.0
    # app 关闭时等待后台 reviewer 完成的最大时间（秒）。超时则取消。
    drain_on_close_seconds: 120.0

    # ---------- 存储 ----------
    # evolution 产物根目录。.kongming/* 派生到 kongming_home。
    root_path: .kongming/evolution

# ---------------------------------------------------------------------------
# safety v0.1.4 — 安全审批与边界配置
# ---------------------------------------------------------------------------
#
# 主决策模型：HardBlock → SilentAllow → ExplicitConsent。
# 用户配置 **追加** 默认规则，不替换；安全基线不可被降级。
# runtime 内置安全基线见 src/safety/approval/default_rules.py；智能审批默认阻断规则见
# src/safety/auto_approval/default_rules.yaml。用户配置追加默认规则，不替换默认规则。
#
# v0.1.4 boundary_kind 恒为 host：boundary_scope 仅接受 "any" / "host"，写 "sandbox" 会被拒。
# 详见 docs/safety-scope-v0.1.4/04-data-and-state.md。
safety:
  # ---- ① hard_deny_commands —— 命令硬禁，命中即拒，不弹批准框 ----
  # match_mode: segment_regex（regex 按 shell segment 匹配）| profile（命名 action profile）
  # boundary_scope: any（host/sandbox 都生效）| host（仅 host）
  #
  # ⚠️ yaml 注意事项：
  # - 整个 matcher 字符串建议用双引号包起来
  # - 双引号字符串内反斜杠要写成 \\（如 \\s = 空白，\\b = word boundary）
  # - 单引号字符串里反斜杠不需要转义（如 '\s+'），但单引号内不能写 ''（空字符串）
  # - regex 用法：^cmd\\s+ ... \\b<keyword>(/|$|\\s) 这种结构最稳
  #
  # 路径相关：matcher 是 regex，**对完整 shell 命令字符串做 segment 切分后
  # 逐段 re.search**，路径在这里是**字面文本**，不展开 ~ 也不解析相对路径。
  # 想"按目标路径"拦的场景，用下方 ③ sensitive_paths 更可靠（按 resolve 后路径）。
  hard_deny_commands: []

  # 更多硬禁示例（取消注释即生效）：
  # hard_deny_commands:
  #   - name: "kubectl-prod-namespace-delete"
  #     matcher: "^kubectl\\s+delete\\s+namespace\\s+prod"
  #     match_mode: "segment_regex"
  #     boundary_scope: "any"
  #     reason: "禁止删除生产 namespace"
  #
  #   - name: "ssh-config-overwrite"
  #     matcher: "^cat\\s+>\\s*~/.ssh/config"
  #     match_mode: "segment_regex"
  #     boundary_scope: "host"
  #     reason: "禁止重写 SSH 配置"

  # ---- ② approval_required_commands —— 命令需人工审批 ----
  # severity: standard（普通确认）| elevated（typed confirm + 不允许 [s]/[p]）
  approval_required_commands:
    # 任何递归删除（rm -r* / rm -rf / rm --recursive）一律 elevated 审批。
    # default_rules.py 已 hard_deny 根级目标（rm -rf / / ~ / $HOME / .）；
    # sensitive_paths block 已拦个人数据目录（上面 ~/Documents 等）；
    # trusted_workdirs（.kongming/work/、.kongming/tmp/）走 silent_allow 不进
    # ConsentResolver。所以本规则**只覆盖剩余的灰色地带**：相对路径子目录
    # （rm -rf warp / build / node_modules 等）、未列入敏感的绝对路径等。
    # severity=elevated → UI 显示高强度审批弹框（典型实现：默认拒绝、需明确点击、
    # 不接受顺手回车），避免顺手点同意酿成误删。
  - name: "rm-recursive-elevated"
      # macOS BSD rm 支持 -R 大写，GNU rm 支持 -r 小写 / --recursive；都拦。
      # 短选项簇：-rf / -fr / -fR / -Rf 等任意顺序。
    matcher: "^rm\\s+(-[a-zA-Z]*[rR][a-zA-Z]*|--recursive)\\b"
    match_mode: "segment_regex"
    severity: "elevated"
    boundary_scope: "any"
    reason: "递归删除：升级 elevated 审批，避免顺手点同意"
  # 例子：
  # approval_required_commands:
  #   - name: "git-force-push"
  #     matcher: "^git\\s+push.*--force"
  #     match_mode: "segment_regex"
  #     severity: "elevated"
  #     boundary_scope: "any"
  #     reason: "强制推送会覆盖远端历史"
  #
  #   - name: "docker-system-prune"
  #     matcher: "^docker\\s+system\\s+prune"
  #     match_mode: "segment_regex"
  #     severity: "standard"
  #     boundary_scope: "host"
  #     reason: "清理 Docker 资源不可逆"

  # ---- ③ sensitive_paths —— 路径风险按 read/write 分流 ----
  # match_mode 决定 matcher 怎么解析：
  #   - path_prefix      —— 绝对路径或 ~/  会做 expanduser + resolve；
  #                         例：matcher="~/.kube/config" → /Users/<you>/.kube/config
  #   - project_relative —— 项目相对路径，拼接到 <project_root>；
  #                         例：matcher="scratch/" → <project_root>/scratch/
  #                         project_root = `git rev-parse --show-toplevel` 推导，
  #                         不在 git 仓库时退化为启动 cwd（受 --workdir / -C 影响）
  #   - glob             —— 仅文件名层匹配（当前实现粒度等于"项目根下任意文件"，
  #                         见 _resolve_sensitive_matcher docstring 的已知 gap）；
  #                         例：matcher=".env*" / "*.pem"
  # ops: ["read", "write", "exec"] 子集
  # effect: block（HardBlockGuard 拦截）| elevated（升级 ask）| allow（静默放行）
  sensitive_paths:
    # === 个人数据目录保护（按路径硬拦，比命令 regex 更可靠）===
    # default_rules.py baseline 只覆盖凭据类（~/.ssh / ~/.aws/credentials 等），
    # 不覆盖用户日常文档目录。本组规则补齐：agent 通过任何 tool 接触这些目录的
    # write 都会被 HardBlockGuard 直接拦截（不经审批弹框）。

  - name: "user-documents"
    matcher: "~/Documents/"
    match_mode: "path_prefix"
    ops: ["read", "write"]
    effect: "block"
    boundary_scope: "any"
    reason: "用户文档目录，agent 不应触碰个人数据"

  - name: "user-desktop"
    matcher: "~/Desktop/"
    match_mode: "path_prefix"
    ops: ["read", "write"]
    effect: "block"
    boundary_scope: "any"
    reason: "用户桌面，可能含临时敏感文件"

  - name: "user-downloads"
    matcher: "~/Downloads/"
    match_mode: "path_prefix"
    ops: ["read", "write"]
    effect: "block"
    boundary_scope: "any"
    reason: "下载目录，常含未审核的外部文件"

  - name: "macos-keychains"
    matcher: "~/Library/Keychains/"
    match_mode: "path_prefix"
    ops: ["read", "write"]
    effect: "block"
    boundary_scope: "any"
    reason: "macOS 钥匙串容器"

  - name: "macos-mail"
    matcher: "~/Library/Mail/"
    match_mode: "path_prefix"
    ops: ["read", "write"]
    effect: "block"
    boundary_scope: "any"
    reason: "本地邮件存档"

    # 媒体目录：read 不拦（让 agent 看图/音/视频是合理用例），write 硬拦
  - name: "user-pictures-write"
    matcher: "~/Pictures/"
    match_mode: "path_prefix"
    ops: ["write"]
    effect: "block"
    boundary_scope: "any"
    reason: "禁止删除/修改个人照片"

  - name: "user-movies-write"
    matcher: "~/Movies/"
    match_mode: "path_prefix"
    ops: ["write"]
    effect: "block"
    boundary_scope: "any"
    reason: "禁止删除/修改个人视频"

  - name: "user-music-write"
    matcher: "~/Music/"
    match_mode: "path_prefix"
    ops: ["write"]
    effect: "block"
    boundary_scope: "any"
    reason: "禁止删除/修改个人音乐"

    # 跨卷写规则已删除：项目本身在 /Volumes/ 下，该规则导致所有写操作
    # 都被升级为 elevated 审批（需输确认码），误伤正常文件操作。
  # 例子：
  # sensitive_paths:
  #   - name: "kubeconfig"
  #     matcher: "~/.kube/config"
  #     match_mode: "path_prefix"
  #     ops: ["read", "write"]
  #     effect: "elevated"
  #     boundary_scope: "host"
  #     reason: "K8s 凭据"
  #
  #   - name: "project-scratch-allow"
  #     matcher: "scratch/"
  #     match_mode: "project_relative"
  #     ops: ["read", "write"]
  #     effect: "allow"
  #     boundary_scope: "any"
  #     reason: "本项目低风险目录，静默放行"
  #
  #   - name: "secret-key-files"
  #     matcher: "*.pem"
  #     match_mode: "glob"
  #     ops: ["read", "write"]
  #     effect: "block"
  #     boundary_scope: "any"
  #     reason: "TLS 私钥文件"

  # ---- ④ trusted_workdirs —— 默认作用域之外的可信工作目录 ----
  # 命中后 read/write 直接 silent_allow（intrinsic）。
  # 默认已含 .kongming/work/ 和 .kongming/tmp/（在 default_rules.py 内嵌）。
  #
  # 路径解析：**仅接受项目相对路径**，拼接到 <project_root> 下。
  #   ✅ "scratch/"           → <project_root>/scratch/
  #   ✅ "build/output/"      → <project_root>/build/output/
  #   ❌ "~/anywhere"         不展开 ~，会变成 <project_root>/~/anywhere（静默失效）
  #   ❌ "/abs/path"          不展开绝对路径，会变成 <project_root>//abs/path（静默失效）
  # 想表达"home 下目录信任放行"，用 sensitive_paths 的 path_prefix 模式（见上）
  # 或 allow_writes（仅写）。
  skill_call_rules: []

  trusted_workdirs: []
  # 例子：
  # trusted_workdirs:
  #   - "scratch/"
  #   - "build/output/"

  # ---- ⑤ allow_writes —— 配置静默放行的写路径（grant scope=config）----
  # 命中后 silent_allow + decision_source=config（**仅 write**，read 不靠它）。
  #
  # 路径解析（**与 trusted_workdirs / sensitive_paths 不一致，已知不一致**）：
  #   - 字符串字面**前缀**比对，**不展开 `~`**，**不 resolve 相对路径**
  #   - tool 调用传入的 path 一律 expanduser + resolve 成绝对路径后再比对前缀
  # 实用建议：
  #   ✅ "/Users/me/scratch/"     绝对路径，可命中 LLM 写 "~/scratch/foo"
  #                               （后者解析后 = /Users/me/scratch/foo）
  #   ✅ "/tmp/kongming-"         绝对前缀
  #   ❌ "~/scratch/"             永远不命中（请求方解析后是绝对路径）
  #   ❌ "scratch/"               依赖请求方 resolve 出来的字符串前缀，不可靠
  allow_writes: []
  # 例子：
  # allow_writes:
  #   - "/Users/me/scratch/"
  #   - "/tmp/kongming-"

  # ---- ⑥ allow_tools_silent —— 配置静默放行的工具白名单 ----
  # 命中工具的所有调用（不看 path）直接 silent_allow，不进 ask。
  # 此字段是 tool **名字**集合，**不涉及路径**——填工具的 `name` 属性即可。
  # read 类工具放这里最常见；放 write_file 等价于"全盘信任所有写入"，慎用。
  allow_tools_silent:
  - "read_file"
  - "list_dir"
  - "list_agent_roles"
  - "create_agent_role"

  # ---- ⑦ log_silent_reads —— silent_allow + read 操作的 trace 写盘开关 ----
  # 默认 false（避免 jsonl 膨胀）；调试时设 true 可看到完整决策事件。
  # 也可临时用 KONGMING_SAFETY_LOG_SILENT_READS=true 覆盖。
  log_silent_reads: false

  # ---- env 覆盖（4 个） ----
  # KONGMING_SAFETY_TRUSTED_WORKDIRS=".kongming/work/,.kongming/tmp/"
  # KONGMING_SAFETY_ALLOW_WRITES="~/scratch/,/tmp/kongming-*/"
  # KONGMING_SAFETY_ALLOW_TOOLS_SILENT="read_file,list_dir,list_agent_roles,create_agent_role"
  # KONGMING_SAFETY_LOG_SILENT_READS=true


# =============================================================================
# Web 宿主壳（v0.1.5+）
# =============================================================================
#
# 启用方式：把 enabled 改为 true，然后 `make web` 启动 uvicorn。
# 默认 enabled=false：CLI 路径完全不受 web 段配置影响。
#
# 文档：docs/web-multi-thread-frontend-v0.1.5/
web:
  # 是否启用 web 宿主壳（默认 false；启用前先 review 整段配置）
  enabled: true

  # uvicorn bind IP：仅本机用 127.0.0.1；需外网访问改 0.0.0.0 + 防火墙
  host: "0.0.0.0"
  port: 60000
  # 二维码扫码登录使用的服务器 origin；公网填 https://域名，局域网填 http://局域网IP:端口。
  server_origin: https://kongming.ktkid.fun:12306
  host_environment: browser

  # 跳过登录鉴权（仅本地开发！）；上线必须 false 并设强密码
  dev_mode: false
  # 首次部署时使用的明文初始密码；长期登录凭据会落到 password store。
  initial_password:

  # 浏览器 Origin 白名单；空列表 = 拒绝所有跨域；本机调试可填 ["http://localhost:5173"]
  cors_origins: []

  # cell 空闲多久后自动 evict（默认 30 分钟，下限 60s）
  idle_timeout_seconds: 1800

  # 后台扫盘检查周期（默认 60s，下限 10s）
  idle_check_interval_seconds: 60

  # dashboard 状态页轮询周期（默认 5s；代码层最小按 3s 生效）
  dashboard_poll_interval_seconds: 5

  # 单次审批等待上限（超时默认拒绝，默认 60s，下限 10s）
  pending_approval_timeout_seconds: 60
  # 前端 WebSocket 前台 ping 间隔，单位毫秒；默认 30 秒。
  ws_heartbeat_interval_ms: 30000
  # 浏览器标签页进入后台后的 ping 间隔，单位毫秒；默认 60 秒。
  ws_heartbeat_background_interval_ms: 60000
  # 单次 pong 等待超时，单位毫秒；默认 10 秒。
  ws_heartbeat_timeout_ms: 10000
  # 连续丢失 pong 的最大次数；达到后判定连接失活。
  ws_heartbeat_max_missed: 3

  # 前后端通信全量日志配置，默认关闭；用于排查 Web 运行链路。
  full_log:
    # 是否启用前后端通信全量日志；默认关闭。
    enabled: false
    # 全量日志写入路径；.kongming/* 会派生到 kongming_home。
    path: .kongming/logs/full_log.jsonl
    # 是否按自然日切分全量日志文件。
    rotate_daily: true
    # 是否记录 HTTP 请求和响应 body；默认关闭以降低敏感信息风险。
    include_http_body: false
    # 全量日志异步队列容量；队列满时丢弃最旧记录。
    queue_size: 10000

  # Deep Research 来源工具配置；Web 运行时按工具名自动探测搜索和读取能力。
  deep_research_source_provider:
    # 是否启用 Web Deep Research 来源工具自动装配。
    enabled: true
    # 写入 Deep Research artifact 的来源 provider 名称。
    provider_name: web_user_tool_research_source
    # 显式指定搜索工具名；留空时按候选列表自动探测。
    search_tool_name:
    # 显式指定读取工具名；留空时按候选列表自动探测。
    fetch_tool_name:
    # 自动探测搜索工具名列表，按顺序匹配。
    search_tool_names:
    - deep_research_search
    - web_search
    - search_web
    - browser_search
    # 自动探测读取工具名列表，按顺序匹配。
    fetch_tool_names:
    - deep_research_fetch
    - web_fetch
    - fetch_url
    - browser_fetch

  # LLM preset 列表；浏览器创建 thread 时下拉选其一。
  # v0.1.5 留空，由 web-app-shell 任务实际填默认 preset。
  llm_presets:
  - id: bigmodel-glm5
    display_name: "智谱 GLM-5.1"
    base_url: https://open.bigmodel.cn/api/coding/paas/v4
    model: glm-5.1
    api_key_env: GLM_API_KEY
    reasoning_effort: high
  - id: minimax-m3
    display_name: "MiniMax M3"
    base_url: https://api.minimaxi.com/anthropic
    model: MiniMax-M3
    api_key_env: MINIMAX_API_KEY
    reasoning_effort: high
  - id: deepseek
    display_name: "deepseek-v4-flash"
    base_url: https://api.deepseek.com/anthropic
    model: deepseek-v4-flash
    api_key_env: DEEPSEEK_API_KEY
    reasoning_effort: medium
  # 示例：
  # llm_presets:
  #   - id: claude-sonnet-4
  #     display_name: "Claude Sonnet 4"
  #     provider: anthropic
  #     base_url: https://api.anthropic.com
  #     model: claude-sonnet-4-20250514
  #     api_key_env: ANTHROPIC_API_KEY
  #     reasoning_effort: medium
  #   - id: lm-studio-local
  #     display_name: "LM Studio 本地"
  #     base_url: http://127.0.0.1:1234/v1
  #     model: gemma-4-e4b-it
  #     # 本地端点不需要 api_key_env

  # ---- 启用 / 调优请改上方 yaml 字段，或用 KONGMING_WEB_* env 覆盖 ----
  # 完整 env 清单见 .env.example 的「Web 服务」段（单一真源；本处不再列）。

workflow:
  enabled: true
  # 留空时使用 <kongming_home>/workflows；显式 .kongming/* 会继续派生到 kongming_home。
  home:
  scan_interval: 30.0

sitian:
  version: v1
  default_scan_interval_sec: 300
  idle_sleep_sec: 30
  # 留空时使用 <kongming_home>/sitian；设置后作为该根目录下的相对子目录名。
  output_subdir:
  scanner:
    recent_session_window_days: 3
    session_recent_user_messages: 1
    session_recent_assistant_messages: 1
    session_message_max_chars: 500
  analyzer:
    enabled: false
    model_name: ""
    base_url: ""
    api_key_env: SITIAN_ANALYZER_API_KEY
    max_tokens: 2048
    temperature: 0.3
    timeout: 30
    max_context_chars: 50000
    skip_if_unchanged: true
    full_log_enabled: false
  interests:
    projects: []
    focus: ""
  sources: []
