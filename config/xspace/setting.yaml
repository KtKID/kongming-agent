config_schema_version: v0.6  # 配置结构版本；当前版本为 v0.6。

# XSpace 打包用 Kongming Web runtime 默认配置。
#
# 用途：
#   这份配置是 x-space resources 中 `kongming/config/setting.yaml` 的源文件。
#   它描述桌面产品默认行为，和仓库根 `config/setting.yaml` 的本地开发默认值分离。
#
# 维护规则：
#   1. 新增 Config 字段先写入仓库根 `config/setting.yaml`。
#   2. 本文件与 `config/xspace/sync-policy.yaml` 共同覆盖全部 Config leaf 字段；
#      XSpace 需要显式产品默认值时写入本文件，只属于主配置的字段写 main-only 决策。
#   3. 密钥、token、密码、个人路径不写入安装包；使用空值、环境变量名或 app data 注入。
#   4. x-space 启动时先把本文件复制/合并到 `<kongming_home>/setting.yaml`，再用
#      `--config <kongming_home>/setting.yaml` 拉起 sidecar，ready 后调用
#      `POST /api/xspace/runtime/init` 标记 XSpace 运行态。
#   5. safety.* 空数组只表示 XSpace 无额外追加策略；内置安全基线来自
#      `src/safety/approval/default_rules.py` 和 `src/safety/auto_approval/default_rules.yaml`。

model:
  preset_id: local-gemma-4-e4b-it
  reasoning_effort:
runner:
  max_turns: 90

session:
  # 桌面端默认落盘，便于重启后恢复会话。
  backend: file
  # .kongming/* 运行数据路径统一派生到 kongming_home（x-space 运行时由 --home 指定）。
  store_path: .kongming/sessions.db
  file_store_path: .kongming/sessions

trace:
  # .kongming/* 运行数据路径统一派生到 kongming_home。
  output_path: .kongming/trace.jsonl
  auto_flush: true
  raw_llm: false

logging:
  level: INFO

host:
  # 当前 HostConfig schema 只允许 cli；Web 入口由 hosts.web.run 和 web.enabled 决定。
  kind: cli

approval:
  mode: interactive

tool:
  shell:
    enabled: true
    timeout_seconds: 30.0
    max_stream_bytes: 8000
    terminate_grace_seconds: 2.0
  file:
    enabled: true
    read_max_bytes: 65536

mcp:
  servers:
  - server_id: minimax
    command: uvx
    args:
    - minimax-coding-plan-mcp
    - -y
    env:
      MINIMAX_API_HOST: https://api.minimax.io
    secret_env_keys:
    - MINIMAX_API_KEY
    initialize_timeout_ms: 30000
    call_timeout_ms: 60000

web_search:
  # 保持通用 web_search 能力开启；没有底层搜索工具时只产生可诊断的缺失状态。
  enabled: true
  provider_name: minimax_web_search
  search_tool_name: null
  search_tool_names:
    - web_search
    - mcp__minimax__web_search
  max_results: 5

compactor:
  enabled: false
  max_messages: 50
  keep_recent: 20
  keep_system: true
  tool_result_max_chars: 2000

retry:
  max_retries: 3
  retry_backoff: 1.0

cli:
  show_reasoning: false

evolution:
  memory:
    enabled: true
    # .kongming/* 运行数据路径统一派生到 kongming_home。
    root_path: .kongming/memory
    inject_prompt: true
    read_max_chars: 65536
    view_max_chars: 8000
  learning:
    enabled: false
    mode: child_agent
    background: true
    auto_trigger_enabled: true
    preset_id:
    reasoning_effort:
    every_n_runs: 5
    min_user_turns: 3
    max_history_messages: 20
    max_nutrients: 2
    nutrient_confidence_threshold: 0.75
    review_timeout_seconds: 30.0
    drain_on_close_seconds: 10.0
    # .kongming/* 运行数据路径统一派生到 kongming_home。
    root_path: .kongming/evolution

stream:
  enabled: true
  read_timeout: 120.0
  suppress_content_after_tool_call: true
  delta_sampling: none
  periodic_batch_size: 20

safety:
  # 每个 cwd 的 user / llm / full_trust 模式独立保存；此处只提供 llm 复核器。
  approval:
    llm:
      provider: openai_compatible
      model: MiniMax-M2.5
      base_url: https://api.minimaxi.com/v1
      # 设置 KONGMING_SAFETY_APPROVAL_LLM_API_KEY 覆盖此值。
      api_key: ""
      api_key_header: authorization-bearer
      timeout_seconds: 15.0
      prompt_template_path:

scheduler:
  enabled: true
  # 留空时使用 <kongming_home>/cron；显式 .kongming/* 会继续派生到 kongming_home。
  home:
  interval: 1.0
  max_inflight: 8
  max_task_age_seconds:
  default_timezone: Asia/Shanghai
  default_delivery_channel: web
  default_max_turns: 90
  approval:
    mode: trust
    allow_write_file_create_in_cwd: true

web:
  enabled: true
  host: 127.0.0.1
  # x-space 可传 --port 0 动态分配；固定默认值保留给资源配置和显式端口模式。
  port: 60000
  # 二维码扫码登录使用的服务器 origin；公网填 https://域名，局域网填 http://局域网IP:端口。
  server_origin: https://kongming.ktkid.fun:12306
  # 持久配置默认保持 browser；XSpace 运行态由 `POST /api/xspace/runtime/init` 覆盖。
  host_environment: browser
  dev_mode: false
  initial_password:
  cors_origins: []
  idle_timeout_seconds: 1800
  idle_check_interval_seconds: 60
  dashboard_poll_interval_seconds: 5
  ws_heartbeat_interval_ms: 30000
  ws_heartbeat_background_interval_ms: 60000
  ws_heartbeat_timeout_ms: 10000
  ws_heartbeat_max_missed: 3
  full_log:
    enabled: false
    # .kongming/* 运行数据路径统一派生到 kongming_home。
    path: .kongming/logs/full_log.jsonl
    rotate_daily: true
    include_http_body: false
    queue_size: 10000
  deep_research_source_provider:
    enabled: true
    provider_name: web_user_tool_research_source
    search_tool_name: null
    fetch_tool_name: null
    search_tool_names:
      - deep_research_search
      - web_search
      - search_web
      - browser_search
    fetch_tool_names:
      - deep_research_fetch
      - web_fetch
      - fetch_url
      - browser_fetch

workflow:
  enabled: true
  # 留空时使用 <kongming_home>/workflows；显式 .kongming/* 会继续派生到 kongming_home。
  home:
  scan_interval: 30.0

sitian:
  version: v1
  default_scan_interval_sec: 300
  idle_sleep_sec: 30
  # 留空时使用 <kongming_home>/sitian；设置后作为该根目录下的相对子目录名。
  output_subdir:
  scanner:
    recent_session_window_days: 3
    session_recent_user_messages: 1
    session_recent_assistant_messages: 1
    session_message_max_chars: 500
  analyzer:
    enabled: false
    preset_id:
    reasoning_effort:
    max_context_chars: 50000
    skip_if_unchanged: true
    full_log_enabled: false
  interests:
    projects: []
    focus: ""
  sources: []
