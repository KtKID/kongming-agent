version: 2
providers:
  - provider_id: minimax
    default_preset_id: minimax-m3
    display_name: Minimax
    region_label: CN
    description: 中国区 Minimax API Key，用于启用对应模型预设。
    logo_text: M
    protocol: anthropic
    default_base_url: https://api.minimaxi.com/anthropic
    default_api_key_env: MINIMAX_API_KEY
    fallback_api_key_envs:
      - KONGMING_PROVIDER_MINIMAX_API_KEY
    default_api_key_header: x-api-key
    request_defaults:
      timeout_seconds: 60
      max_tokens: 4096
      temperature: 0.7
    models:
      - preset_id: minimax-m3
        display_name: MiniMax-M3
        model: MiniMax-M3
        reasoning:
          adapter: configurable_patch
          supported_efforts: [high]
          default_effort: high
          supports_disabled: true
          enabled_patch:
            thinking:
              type: adaptive
          disabled_patch:
            thinking:
              type: disabled
          effort_map:
            low: high
            medium: high
            high: high
            max: high
    match_keywords: [minimax, mini max]
    match_hosts: [api.minimaxi.com]

  - provider_id: glm
    default_preset_id: bigmodel-glm5-1m
    display_name: GLM
    region_label: CN
    description: 智谱 GLM API Key，用于启用 GLM 模型预设。
    logo_text: G
    protocol: openai
    default_base_url: https://open.bigmodel.cn/api/coding/paas/v4
    default_api_key_env: GLM_API_KEY
    fallback_api_key_envs: [BIGMODEL_API_KEY, ZHIPU_API_KEY, ZAI_API_KEY]
    default_api_key_header: authorization-bearer
    request_defaults:
      timeout_seconds: 60
      max_tokens: 4096
      temperature: 0.7
    models:
      - preset_id: bigmodel-glm5-1m
        display_name: glm-5.2
        model: glm-5.2
        context_window_tokens: 1000000
        request_defaults:
          max_tokens: 65536
          temperature: 1.0
        reasoning:
          adapter: glm_thinking_toggle
          supported_efforts: [low, medium, high]
          default_effort: high
          supports_disabled: true
      - preset_id: bigmodel-glm5
        display_name: glm-5.1
        model: glm-5.1
        reasoning:
          adapter: glm_thinking_toggle
          supported_efforts: [high]
          default_effort: high
          supports_disabled: true
          effort_map:
            low: high
            medium: high
            high: high
            max: high
    match_keywords: [glm, bigmodel, 智谱]
    match_hosts: [open.bigmodel.cn]

  - provider_id: deepseek
    default_preset_id: deepseek
    display_name: DeepSeek
    region_label: CN
    description: DeepSeek API Key，用于启用 DeepSeek 模型预设。
    logo_text: D
    protocol: anthropic
    default_base_url: https://api.deepseek.com/anthropic
    default_api_key_env: DEEPSEEK_API_KEY
    default_api_key_header: x-api-key
    request_defaults:
      timeout_seconds: 60
      max_tokens: 4096
      temperature: 0.7
    models:
      - preset_id: deepseek
        display_name: deepseek-v4-flash
        model: deepseek-v4-flash
        reasoning:
          adapter: deepseek_anthropic_thinking
          supported_efforts: [high, max]
          default_effort: high
          supports_disabled: true
          effort_aliases:
            xhigh: max
            highest: max
          effort_map:
            low: high
            medium: high
            high: high
            max: max
      - preset_id: deepseek-pro
        display_name: deepseek-v4-pro
        model: deepseek-v4-pro
        reasoning:
          adapter: deepseek_anthropic_thinking
          supported_efforts: [high, max]
          default_effort: high
          supports_disabled: true
          effort_aliases:
            xhigh: max
            highest: max
          effort_map:
            low: high
            medium: high
            high: high
            max: max
    match_keywords: [deepseek, deep seek]
    match_hosts: [api.deepseek.com]

  - provider_id: local-baseline
    default_preset_id: local-gemma-4-e4b-it
    display_name: Local
    region_label: Local
    description: 本地 OpenAI-compatible baseline。
    logo_text: L
    protocol: openai
    default_base_url: http://127.0.0.1:62000/v1
    default_api_key_env:
    default_api_key_header: authorization-bearer
    request_defaults:
      timeout_seconds: 60
      max_tokens: 4096
      temperature: 0.7
    models:
      - preset_id: local-gemma-4-e4b-it
        display_name: gemma-4-e4b-it
        model: gemma-4-e4b-it
    match_keywords: [local, gemma]
    match_hosts: [localhost, 127.0.0.1]
