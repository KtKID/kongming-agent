# kongming-agent 本地模型基线配置
#
# 这是 v1-mini 的标准本地测试基线：用 OpenAI-compatible 格式接本地模型服务。
# - 本地模型语义：base_url 必填，api_key 允许为空。
# - 不要把"本地模型"硬编码成代码里的特殊分支；语义差异通过此配置文件表达。
# - 与 default.yaml 的差异仅在注释强调：本配置默认就是本地模式。

model:
  provider: openai_compatible
  name: gemma-4-e4b-it
  # 本地 OpenAI-compatible 服务地址（例如 LM Studio / Ollama 兼容层 / vLLM）。
  base_url: http://127.0.0.1:1234
  # 本地服务通常不需要鉴权；保持空串即可。
  api_key: ""
  timeout: 60
  max_tokens: 4096
  temperature: 0.7

runner:
  max_turns: 10

session:
  backend: memory
  store_path: .kongming/sessions.db

trace:
  output_path: .kongming/trace.jsonl

logging:
  level: INFO

host:
  kind: cli

approval:
  mode: interactive

tool:
  shell:
    enabled: true
  file:
    enabled: true
