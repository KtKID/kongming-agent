# kongming-agent 默认配置示例
#
# 这份配置覆盖第一版必须显式支持的全部配置项（见 plan.md「配置 Schema 与约束」）。
# 真实启动时建议复制后改成自己的本地或远端模型配置；
# 也可以通过环境变量 KONGMING_CONFIG 指定完整路径覆盖默认查找。

model:
  # provider 名称。第一版只落 openai_compatible，未来可扩展 anthropic 等。
  provider: openai_compatible
  # 模型名。本地默认走 gemma-4-e4b-it。
  name: gemma-4-e4b-it
  # OpenAI-compatible 服务地址。
  # 远端：例如 https://api.openai.com/v1
  # 本地：例如 http://127.0.0.1:1234
  base_url: http://127.0.0.1:1234
  # API key。本地模型可为空字符串；远端模型必须填。
  api_key: ""
  # 单次请求超时（秒）。
  timeout: 60
  # 单次响应最大 token 数。
  max_tokens: 4096
  # 采样温度。
  temperature: 0.7

runner:
  # 单次 run 最大轮数，超过即视为 MaxTurnsExceededError。
  max_turns: 10

session:
  # 会话存储后端：memory | sqlite
  # memory：默认进程内 InMemorySession，适合 smoke / 单测。
  # sqlite：context/session_store.py 的工程化实现，支持持久化与恢复。
  backend: memory
  # sqlite 后端使用的存储路径。memory 后端会忽略此项。
  store_path: .kongming/sessions.db

trace:
  # JSONL trace 落盘路径。observability/trace_sink.py 会按 append-only 写入。
  output_path: .kongming/trace.jsonl

logging:
  # 日志级别：DEBUG | INFO | WARNING | ERROR
  level: INFO

host:
  # 第一版仅支持 cli 宿主。
  kind: cli

approval:
  # 审批模式：
  #   interactive  - 命中 ask 时由用户人工确认
  #   auto_allow   - 自动批准（仅用于自动化测试场景）
  #   auto_deny    - 自动拒绝（用于压测 deny 分支）
  mode: interactive

tool:
  shell:
    # 是否启用 shell builtin tool。
    enabled: true
  file:
    # 是否启用 file builtin tool。
    enabled: true
