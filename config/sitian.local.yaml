# =============================================================================
# 司天本地配置（Mac 版）
#
# 入口：./sitian.sh                                  # 推荐：封装好的脚本
#   或：uv run kongming-sitian run-once \
#         --config config/sitian.local.yaml \
#         --root-dir ~/sitian-records
#
# 默认产物根：<kongming_home>/sitian/，kongming_home 默认是 Path.home() / ".kongming"
# 可用 --root-dir 或 sitian.sh 的 SITIAN_ROOT 显式覆盖司天产物根目录。
#
# 本文件只承担"司天 CLI 的配置"。其他模块（web / 主 agent CLI / scheduler）走
# 各自的 config，不复用此文件。
# =============================================================================

# ---- 顶级 model 段（schema 强制必填） ------------------------------------
# 司天 analyzer.preset_id 留空时继承这里的默认 preset。
config_schema_version: v0.6
model:
  preset_id: minimax-m3
  reasoning_effort: high

# =============================================================================
# 司天本体配置
# =============================================================================
sitian:
  version: v1                               # 配置版本号，schema 固定 "v1"
  default_scan_interval_sec: 60             # 全局默认扫描间隔（秒）；各 source 可单独覆盖
  idle_sleep_sec: 3                         # loop 模式两轮之间的最长睡眠（秒）；越短响应越快但 CPU 更忙
  output_subdir: claude                     # 产物落子目录名（相对 root_dir）
                                            # 设置后所有产物落到 <root>/<subdir>/，用于多 kind 隔离
                                            # 不设/留空 → 直接落 <root>/（向后兼容）
                                            # ⚠️ web 端 GET /api/sitian/report 默认走 "claude" channel；
                                            #    这里改了名字 web 弹窗就读不到了

  # ---- Scanner 行为旋钮 -------------------------------------------------
  # 控制扫描器从 jsonl 里取多少上下文喂给后面的 LLM
  scanner:
    recent_session_window_days: 3           # 只看最近 N 天内修改过的 session jsonl；0 = 全读（慢且 prompt 大）
    session_recent_user_messages: 1         # 每个 session 取最后 N 条 user 消息；0 = 不取
    session_recent_assistant_messages: 1    # 每个 session 取最后 N 条 assistant 消息；0 = 不取
    session_message_max_chars: 500          # 每条消息截断到 N 字符（末尾加 "…"）；0 = 不截断（注意 jsonl 可能超长）

  # ---- LLM 分析层（真正调模型的地方） ----------------------------------
  analyzer:
    enabled: true                           # false = 只 scan 不调 LLM（回退到规则化 suggestions）
    preset_id: minimax-m3                   # 留空时继承顶级 model.preset_id
    reasoning_effort: high                  # 请求级推理档位
    max_context_chars: 50000                # 输入 observations 裁剪上限（字符数），超出按最新 session 优先裁剪
    skip_if_unchanged: true                 # observations 没变化时跳过 LLM 调用（用 last_observations_hash 比对，省 token）
    full_log_enabled: true                  # 写完整 LLM 提示词+回复到产物根 full-log/（审计 + 调试用）

  # ---- 用户兴趣（注入到 LLM system prompt） ----------------------------
  interests:
    projects: []                            # 项目路径白名单；空数组 = 分析所有项目
    focus: ""                               # 自然语言补充描述；如 "关注 kongming-agent 的 verify gate 漏洞"

  # ---- 数据源声明 ------------------------------------------------------
  # 每个 source 是一个独立的扫描任务；id 必须全 yaml 内唯一
  sources:
    # ----- source 1: 扫描 ~/.claude/projects/ 取最近修改的 top_n 个项目 -----
    - id: claude-workspace                  # source 唯一 id（不能与其他 source 重名）
      kind: claude_workspace                # 类型：扫整个 claude 家目录，按 jsonl mtime 倒序取 top N
      path: ~/.claude                       # claude 家目录；~/.claude 或 ~/.claude/projects 都行
      top_n: 3                              # 取最近修改的前 N 个项目
      scan_interval_sec: 120                # 该 source 的扫描间隔（秒），覆盖 default_scan_interval_sec
      tags:                                 # 落到 observation.payload.sourceTags，方便后续过滤
        - claude
        - workspace
        - recent

    # ----- 以下 source 模板，按需启用，**注意 id 必须唯一** ----------------

    # source 模板 A：扫单个 claude 项目（按 cwd 过滤会话）
    # - id: claude-kongming-agent
    #   kind: claude_project
    #   path: /Volumes/machub_app/proj/kongming-agent   # 仓库 cwd
    #   include:                                          # glob 白名单（相对 path）
    #     - "src/**"
    #     - "docs/**"
    #   exclude:                                          # glob 黑名单
    #     - "**/.venv/**"
    #     - "**/__pycache__/**"
    #   tags: [claude, single-project]

    # source 模板 B：通用频道扫描（纯文件系统，不绑定任何 SDK）
    # - id: workspace-general
    #   kind: generic_channel
    #   path: /Volumes/machub_app/proj/kongming-agent
    #   include:
    #     - "dev-pipeline/tasks/sitian-v1/*"
    #     - "docs/sitian-v1/*"
    #   tags: [workspace, sitian]

    # source 模板 C：单个 codex 项目
    # - id: codex-kongming-agent
    #   kind: codex_project
    #   path: /Volumes/machub_app/proj/kongming-agent
    #   tags: [codex, single-project]

    # source 模板 D：Kongming Web 通用频道聊天历史
    # - id: kongming-generic-chat
    #   kind: generic_chat
    #   path: ~/.kongming                    # Kongming home；扫描 web/threads 与 sessions
    #   top_n: 10                             # 最近活跃的项目数上限
    #   scan_interval_sec: 120
    #   tags: [kongming, generic-chat]

# =============================================================================
# 产物文件清单（落在 <root>/<output_subdir>/）
# =============================================================================
# config.snapshot.json     ← 最近一次 SiTianConfig 快照
# observations.jsonl       ← 每次扫描追加的事实（append-only，看历史用）
# last_observations_hash   ← 上一次扫描的 hash（skip_if_unchanged 用）
# runtime_state.json       ← 各 source 的 next_run_at / 失败 backoff 状态
# workspace_state.json     ← 归并后的全局视图（feed 给 web 弹窗）
# work_items/<id>.json     ← 单个 work item
# latest_suggestions.json  ← 建议引擎产出
# latest_summary.md        ← 人类可读 Markdown 总结
# sitian_report.json       ← LLM 分析层产出（web GET /api/sitian/report 读取）
# scans/<observed_at>.json ← 每次扫描的快照
# full-log/analyzer-*.json ← LLM 调用完整日志（full_log_enabled=true 才写）
