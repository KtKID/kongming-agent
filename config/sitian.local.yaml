# =============================================================================
# 司天本地配置（Mac 版）
# 入口：./sitian.sh           # 推荐：封装好的脚本
# 或：uv run kongming-sitian run-once --config config/sitian.local.yaml
#                                     --root-dir /tmp/sitian-records
# 默认 root-dir：~/.kongming/SiTian/
# =============================================================================

# ---- LLM 模型（司天本身不调模型，但 Config schema 强制要求 model 段，填占位即可）----
model:
  provider: openai_compatible      # 模型协议：openai_compatible / anthropic
  name: stub-model                 # 模型名（司天不用）
  base_url: http://127.0.0.1:1234/v1   # 本地兼容 OpenAI 服务地址
  api_key: ""                      # 本地服务可空；命中 127/localhost 自动跳 key 校验
  timeout: 60                      # HTTP 超时秒数
  max_tokens: 4096                 # 单次最多生成 token
  temperature: 0.7                 # 采样温度

# ---- runner / session / trace（占位，司天不消费但 Config 必填）----
runner:
  max_turns: 90                    # agent 单轮最多推进几个 turn

session:
  backend: file                    # 会话后端：memory / sqlite / file
  store_path: .kongming/sessions.jsonl
  file_store_path: .kongming/sessions

trace:
  output_path: .kongming/trace.jsonl   # trace 落盘路径
  auto_flush: true
  raw_llm: false

logging:
  level: INFO

host:
  kind: cli                        # 宿主类型，司天不消费

approval:
  mode: interactive                # 审批模式，司天不消费

tool:
  shell:
    enabled: true
    timeout_seconds: 30.0
    max_stream_bytes: 8000
    terminate_grace_seconds: 2.0
  file:
    enabled: true
    read_max_bytes: 65536

compactor:
  enabled: false                   # 历史压缩开关，司天不消费

retry:
  max_retries: 3
  retry_backoff: 1.0

stream:
  enabled: true
  read_timeout: 120.0
  suppress_content_after_tool_call: true
  delta_sampling: none
  periodic_batch_size: 20

scheduler:
  enabled: false                   # cron 调度器，跟司天无关

web:
  enabled: false                   # web server，跟司天无关

# =============================================================================
# 司天本体配置
# =============================================================================
sitian:
  version: v1                          # 配置版本号，目前固定 v1
  default_scan_interval_sec: 60        # 全局默认扫描间隔（秒）。各 source 可覆盖
  idle_sleep_sec: 3                    # 循环模式空闲等待秒数（loop 命令两轮之间最长睡多久）
  output_subdir: claude                # 产物落子目录名（相对 root_dir）。
                                       # 设置后所有产物落到 <root>/<subdir>/。
                                       # 用于多 kind 共存时隔离（claude / codex / general）。
                                       # 不设/留空 → 直接落 <root>/（向后兼容）。

  sources:
    # ---------------------------------------------------------------------
    # source 1: 扫描 ~/.claude/projects/ 取最近修改的 N 个项目（推荐入口）
    # ---------------------------------------------------------------------
    - id: claude-workspace             # source 唯一 id（一次配置内不能重复）
      kind: claude_workspace           # 类型：扫整个 ~/.claude/projects/ 取 top N
      path: ~/.claude                  # claude_home 路径；填 ~/.claude 或 ~/.claude/projects 都行
      top_n: 10                        # 取最近修改的前 N 个项目（按 jsonl mtime 倒序）
      scan_interval_sec: 120           # 该 source 的扫描间隔（秒），覆盖 default
      tags:                            # 标签，落进 observation.payload.sourceTags
        - claude
        - workspace
        - recent

    # ---------------------------------------------------------------------
    # source 2（可选）：扫单个 claude 项目下的会话（按 cwd 过滤）
    # 用 kind=claude_project，path 填项目实际 cwd
    # ---------------------------------------------------------------------
    # - id: claude-kongming-agent
    #   kind: claude_project
    #   path: /Volumes/machub_app/proj/kongming-agent   # 仓库 cwd
    #   include:                                          # glob 白名单（相对 path）
    #     - "src/**"
    #     - "docs/**"
    #   exclude:                                          # glob 黑名单
    #     - "**/.venv/**"
    #     - "**/__pycache__/**"
    #   tags: [claude, single-project]

    # ---------------------------------------------------------------------
    # source 3（可选）：通用频道扫描，纯文件系统、不关联任何 SDK
    # ---------------------------------------------------------------------
    # - id: workspace-general
    #   kind: generic_channel
    #   path: /Volumes/machub_app/proj/kongming-agent
    #   include:
    #     - "dev-pipeline/tasks/sitian-v1/*"
    #     - "docs/sitian-v1/*"
    #   tags: [workspace, sitian]

    # ---------------------------------------------------------------------
    # source 4（可选）：扫单个 codex 项目下的会话（按 cwd 过滤）
    # ---------------------------------------------------------------------
    # - id: codex-kongming-agent
    #   kind: codex_project
    #   path: /Volumes/machub_app/proj/kongming-agent
    #   tags: [codex, single-project]

# =============================================================================
# 产物路径（默认 ~/.kongming/SiTian/，可用 --root-dir 覆盖）
# =============================================================================
# config.snapshot.json     ← 最近一次 SiTianConfig 快照
# observations.jsonl       ← 每次扫描追加的事实（永不删，看历史用）
# runtime_state.json       ← 各 source 的 next_run_at / 失败 backoff 状态
# workspace_state.json     ← 归并后的全局视图
# work_items/<id>.json     ← 单个 work item
# latest_suggestions.json  ← 建议引擎产出
# latest_summary.md        ← 人类可读 Markdown
# scans/<observed_at>.json ← 每次扫描的快照
