# pre-commit / pre-push hooks —— 分两层拦截。
#
# 启用：
#   make install-hooks        # 装 pre-commit + pre-push 两层
#   uv run pre-commit install --hook-type pre-commit --hook-type pre-push
#
# 手工全仓扫描：
#   make precommit            # 跑 pre-commit 阶段（秒级）
#   uv run pre-commit run --all-files --hook-stage pre-push
#
# 临时跳过（仅紧急情况）：git commit --no-verify / git push --no-verify
#
# 分层设计：
# - pre-commit 阶段（每次 commit 跑）：ruff + commit-separation + lint-imports + mypy
# - pre-push 阶段（push 前跑一次）：隔离环境下的受影响 unit 测试
# - CI（GitHub Actions）：全量 fmt/lint/typecheck/unit tests，终极兜底
# - e2e / integration / smoke 不进本地 push gate；真实模型测试走本地 nightly

default_language_version:
  python: python3.11

default_stages: [pre-commit]

repos:
  # ---------------------------------------------------------------------------
  # ruff —— lint + format（pre-commit 阶段，独立隔离 venv，速度快）
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        name: ruff check --fix
        args: [--fix]
      - id: ruff-format
        name: ruff format

  # ---------------------------------------------------------------------------
  # commit 分离 —— 代码和文档不能混在同一个 commit（pre-commit 阶段）
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: check-commit-separation
        name: check code/docs separation
        entry: bin/check-commit-separation.sh
        language: script
        always_run: true
        pass_filenames: false

  # ---------------------------------------------------------------------------
  # local hooks —— 依赖项目 .venv（通过 uv run 调度）
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      # ----- pre-commit 阶段：架构边界（轻，必须每次 commit 守门） -----
      - id: lint-imports
        name: lint-imports (架构边界合约)
        entry: uv run lint-imports --config .importlinter
        language: system
        pass_filenames: false
        files: \.py$

      # ----- pre-commit 阶段：mypy（静态类型检查，提交前拦截） -----
      - id: mypy
        name: mypy (类型检查)
        entry: uv run mypy src
        language: system
        pass_filenames: false
        files: ^src/.*\.py$

      # ----- pre-push 阶段：隔离环境下的受影响 unit 测试 -----
      # run_pre_push_tests.py 会清理真实 KONGMING_* 配置，只选择 tests/unit。
      # 全量回归在 GitHub Actions CI 里跑；真实 e2e 走本地 nightly。
      - id: pre-push-unit
        name: pre-push unit tests (isolated)
        entry: uv run python scripts/run_with_timing.py --label pre-push-unit -- uv run python scripts/run_pre_push_tests.py
        language: system
        pass_filenames: false
        files: ^(src|tests/unit|scripts)/.*\.(py|sh)$|^pyproject\.toml$|^\.pre-commit-config\.yaml$
        stages: [pre-push]
