# pre-commit / pre-push hooks —— 分两层拦截。
#
# 启用：
#   make install-hooks        # 装 pre-commit + pre-push 两层
#   uv run pre-commit install --hook-type pre-commit --hook-type pre-push
#
# 手工全仓扫描：
#   make precommit            # 跑 pre-commit 阶段（秒级）
#   uv run pre-commit run --all-files --hook-stage pre-push
#
# 临时跳过（仅紧急情况）：git commit --no-verify / git push --no-verify
#
# 分层设计：
# - pre-commit 阶段（秒级，每次 commit 跑）：ruff + commit-separation + lint-imports
# - pre-push 阶段（分钟级，push 前跑一次）：mypy + pytest（受影响测试 + 并行）
# - CI（GitHub Actions）：全量 fmt/lint/typecheck/unit tests，终极兜底
# - e2e 不进任何本地 hook（含 opt-in 真模型测试），只留 CI

default_language_version:
  python: python3.11

default_stages: [pre-commit]

repos:
  # ---------------------------------------------------------------------------
  # ruff —— lint + format（pre-commit 阶段，独立隔离 venv，速度快）
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        name: ruff check --fix
        args: [--fix]
      - id: ruff-format
        name: ruff format

  # ---------------------------------------------------------------------------
  # commit 分离 —— 代码和文档不能混在同一个 commit（pre-commit 阶段）
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: check-commit-separation
        name: check code/docs separation
        entry: bin/check-commit-separation.sh
        language: script
        always_run: true
        pass_filenames: false

  # ---------------------------------------------------------------------------
  # local hooks —— 依赖项目 .venv（通过 uv run 调度）
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      # ----- pre-commit 阶段：架构边界（轻，必须每次 commit 守门） -----
      - id: lint-imports
        name: lint-imports (架构边界合约)
        entry: uv run lint-imports --config .importlinter
        language: system
        pass_filenames: false
        files: \.py$

      # ----- pre-push 阶段：mypy（慢，挪到 push 前跑一次） -----
      - id: mypy
        name: mypy (类型检查)
        entry: uv run mypy src
        language: system
        pass_filenames: false
        files: ^src/.*\.py$
        stages: [pre-push]

      # ----- pre-push 阶段：pytest 受影响测试（--picked 只跑 git 改动相关） -----
      # -n 4 并行（限 4 worker 避免资源爆炸），--picked 只跑改动文件相关测试
      # 全量回归在 GitHub Actions CI 里跑（.github/workflows/ci.yml）
      - id: pytest-picked
        name: pytest --picked (受影响 unit 测试，并行)
        entry: uv run python scripts/run_with_timing.py --label pytest-picked -- uv run pytest tests/unit --picked --mode=branch -n 4 -q -W ignore::pytest.PytestUnraisableExceptionWarning
        language: system
        pass_filenames: false
        files: ^(src|tests/unit)/.*\.py$
        stages: [pre-push]
