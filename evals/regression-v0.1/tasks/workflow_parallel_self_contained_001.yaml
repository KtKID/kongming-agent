      from __future__ import annotations
      import asyncio
      import inspect
      from pathlib import Path
      from unittest.mock import MagicMock

      from context import WorkflowExecutionContext
      from strategies.parallel import ParallelWorkflowStrategy


      def _ctx(runtime):
          return WorkflowExecutionContext(
              workflow_id="wf-1", parent_session_id="s-1", mode="parallel",
              workflow_dir=Path("/tmp/wf"), started_at="2026-07-01T00:00:00Z",
              desc="d", audit_writer=object(), runtime=runtime,
          )


      class _AsyncMock:
          """让 MagicMock 的 async 调用返回真正的 coroutine。"""
          def __init__(self):
              self.calls = []
              self.return_value = MagicMock()

          async def __call__(self, *args, **kwargs):
              self.calls.append((args, kwargs))
              return self.return_value


      class TestStrategySelfContained:
          def test_init_takes_no_manager(self):
              sig = inspect.signature(ParallelWorkflowStrategy.__init__)
              params = [p for p in sig.parameters if p != "self"]
              assert "manager" not in params

          def test_strategy_does_not_reference_manager(self):
              import strategies.parallel as pm
              source = inspect.getsource(pm)
              assert "_manager" not in source
              assert "AgentWorkflowManager" not in source

          def test_context_has_runtime_field(self):
              sig = inspect.signature(WorkflowExecutionContext)
              assert "runtime" in sig.parameters


      class TestParallelRunUsesRuntime:
          def test_run_borrows_runtime_not_manager(self):
              runtime = MagicMock()
              runtime.prepare_subagent_tasks.return_value = [MagicMock(task_id="agent-1")]
              runtime.run_subagent_task = _AsyncMock()
              strategy = ParallelWorkflowStrategy()
              payload = {"task_specs": [{"task_name": "t", "prompt": "p"}]}
              asyncio.run(strategy.run(_ctx(runtime), payload))
              runtime.prepare_subagent_tasks.assert_called_once()
              assert len(runtime.run_subagent_task.calls) == 1


      class TestManagerDropsParallelMethods:
          def test_manager_no_longer_has_parallel_methods(self):
              import manager as mm
              assert not hasattr(mm.AgentWorkflowManager, "run_parallel")
              assert not hasattr(mm.AgentWorkflowManager, "run_parallel_specs")

      class TestDescribePreserved:
          def test_describe_returns_title(self):
              """describe 方法不依赖 manager，修复前后行为必须一致（回归保护）。"""
              from strategies.parallel import ParallelWorkflowStrategy
              from unittest.mock import MagicMock
              # 修复后构造无参数；兼容性：若仍接收 manager，用 MagicMock 喂入
              import inspect
              sig = inspect.signature(ParallelWorkflowStrategy.__init__)
              if "manager" in sig.parameters:
                  strategy = ParallelWorkflowStrategy(MagicMock())
              else:
                  strategy = ParallelWorkflowStrategy()
              desc = strategy.describe()
              assert desc.mode == "parallel"
              assert desc.title == "并行子任务"
