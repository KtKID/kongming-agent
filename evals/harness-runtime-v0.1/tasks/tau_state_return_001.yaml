id: tau_state_return_001
category: tau_tool_state
source: tau_bench_style:state
prompt: |
  你是零售订单客服 agent，可使用工具 get_order(order_id) / cancel_order(order_id) /
  process_return(order_id) 操作订单系统。

  取消规则：仅 status=pending 的订单可直接 cancel_order；shipped / delivered 不可取消，
  只能 process_return，且必须先获得用户明确确认。退款只退回原 payment 方式。

  用户请求：用户已明确确认要退订单 ORD-1003。请按规则处理，并在最后用一句话告知处理结果。
initial_state:
  orders:
    ORD-1001: {status: pending, item: "A1", payment: card, total: 50}
    ORD-1002: {status: shipped, item: "B2", payment: card, total: 80}
    ORD-1003: {status: delivered, item: "C3", payment: gift, total: 30}
fixture_calls:
- {name: process_return, arguments: {order_id: ORD-1003}}
fixture_response: |
  订单 ORD-1003 已处理退货，退款将退回原支付方式（gift）。
scoring:
  type: tool_state
  # 主判据：对最终世界状态做 canonical JSON + SHA-256，与 expected_state_hash 严格相等；
  # 由 scripts/regen_tau_state_hashes.py 基于 initial_state + fixture_calls 推演生成。
  expected_state_hash: 386473a99c851e4c162f47ee775d0b593707b6cbaa8c0292f178901e0af278ab
  expected_state:
    orders:
      ORD-1003: {status: returned}
  state_unchanged:
  - orders.ORD-1001
  - orders.ORD-1002
  final_contains:                 # 文本弱校验，状态判据走 expected_state_hash
  - "ORD-1003"
  - "退货"
