id: long_context_001
category: long_context
source: public_style:longbench
prompt: |
  请阅读资料并只输出 JSON：
  {"answer": "...", "source_id": "..."}

  [doc-a]
  仓储管理系统的核心是把货物入库接到分类规则、库位编码、出库审核、权限和观测里。

  [doc-b]
  当前一期上线方案包含 RFID 扫码、SKU 编码、出入库审计、月度盘点和异常告警。

  [doc-c]
  后续二期会加入 AI 预测、动态补货、跨仓调拨和供应商评分。

  问题：一期上线方案包含哪五个部分？答案必须来自资料。
scoring:
  type: json
  equals:
    source_id: doc-b
  contains:
    answer:
      - RFID 扫码
      - SKU 编码
      - 出入库审计
      - 月度盘点
      - 异常告警
fixture_response: |
  {"answer":"RFID 扫码、SKU 编码、出入库审计、月度盘点和异常告警","source_id":"doc-b"}
